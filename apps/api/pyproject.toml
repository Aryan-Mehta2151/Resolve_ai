[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "resolveai-api"
version = "0.1.0"
description = "ResolveAI FastAPI application and worker dependencies"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18,<2",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.6,<6",
  "email-validator>=2.2,<3",
  "fastapi>=0.162,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "langchain-openai>=0.3,<2",
  "mcp>=2.3,<3",
  "openai>=3,<4",
  "PyJWT>=2.10,<3",
  "pydantic-settings>=2.16,<3",
  "pwdlib[argon2]>=0.2.1,<1",
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.40,<2",
  "redis>=5.2,<6",
  "SQLAlchemy>=2.0,<2.1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.41,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
